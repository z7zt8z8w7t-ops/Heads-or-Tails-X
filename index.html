            document.getElementById('callButtons').style.display = 'grid';
            
            const coin = document.getElementById('coin');
            const coinFace = document.getElementById('coinFace');
            coin.className = 'coin heads';
            coinFace.textContent = 'H';
            
            isFlipping = false;
        }
        
        function bust() {
            if (currentPlayer === 'her') {
                herUnbanked = [];
            } else {
                himUnbanked = [];
            }
            
            switchPlayer();
            resetRound();
        }
        
        function switchPlayer() {
            currentPlayer = currentPlayer === 'her' ? 'him' : 'her';
            updateDisplay();
        }
        
        function resetRound() {
            document.getElementById('wonCard').style.display = 'none';
            document.getElementById('actionButtons').style.display = 'none';
            document.getElementById('resultMessage').style.display = 'none';
            document.getElementById('callButtons').style.display = 'grid';
            
            const coin = document.getElementById('coin');
            const coinFace = document.getElementById('coinFace');
            coin.className = 'coin heads';
            coinFace.textContent = 'H';
            
            isFlipping = false;
            updateDisplay();
        }
        
        function checkWin() {
            const herTotal = herBanked.length;
            const himTotal = himBanked.length;
            
            if (herTotal >= 10 || himTotal >= 10) {
                const winner = herTotal >= 10 ? 'Her' : 'Him';
                const winnerCards = herTotal >= 10 ? herBanked : himBanked;
                
                document.getElementById('winnerText').textContent = winner + ' wins with ' + winnerCards.length + ' cards!';
                document.getElementById('winnerCards').innerHTML = winnerCards
                    .map(c => '<div style="padding: 5px;">' + c.name + ' ' + '🔥'.repeat(c.difficulty) + '</div>')
                    .join('');
                document.getElementById('winnerModal').classList.add('show');
                return true;
            }
            return false;
        }
        
        function resetGame() {
            herBanked = [];
            himBanked = [];
            herUnbanked = [];
            himUnbanked = [];
            currentPlayer = 'her';
            document.getElementById('winnerModal').classList.remove('show');
            resetRound();
            showCollection('all');
        }
        
        function updateDisplay() {
            const indicator = document.getElementById('turnIndicator');
            const text = document.getElementById('turnText');
            indicator.className = 'turn-indicator ' + (currentPlayer === 'her' ? 'her-turn' : 'his-turn');
            text.textContent = currentPlayer === 'her' ? 'Her Turn' : 'His Turn';
            
            document.getElementById('herScore').textContent = herBanked.length;
            document.getElementById('hisScore').textContent = himBanked.length;
            document.getElementById('herUnbanked').textContent = 'Unbanked: ' + herUnbanked.length;
            document.getElementById('hisUnbanked').textContent = 'Unbanked: ' + himUnbanked.length;
        }
        
        function showCollection(filter) {
            const grid = document.getElementById('cardsGrid');
            let cards = [];
            
            if (filter === 'all') {
                cards = [
                    ...herBanked.map(c => ({...c, owner: 'her'})),
                    ...himBanked.map(c => ({...c, owner: 'him'}))
                ];
            } else if (filter === 'her') {
                cards = herBanked.map(c => ({...c, owner: 'her'}));
            } else {
                cards = himBanked.map(c => ({...c, owner: 'him'}));
            }
            
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            grid.innerHTML = cards.length ? cards.map(card => 
                '<div class="mini-card ' + card.owner + '-card">' +
                '<div class="mini-card-name">' + card.name + '</div>' +
                '<div class="mini-card-flames">' + '🔥'.repeat(card.difficulty) + '</div>' +
                '</div>'
            ).join('') : '<div style="color: rgba(255,255,255,0.5); text-align: center; grid-column: span 2;">No cards yet</div>';
        }
    </script>
</body>
</html>
